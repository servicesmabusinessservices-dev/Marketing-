name: Deploy to Production

on:
  push:
    branches: [deploy]

jobs:
  # ── Render auto-deploys via webhook — this job notifies ────────
  # Render's GitHub integration auto-deploys when the deploy branch
  # is pushed. This workflow just validates the build first.
  #
  # If you want manual webhook triggers instead of Render's GitHub
  # integration, uncomment the deploy-render job below.

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build solution
        run: dotnet build EmailMultiAccountApp.sln -c Release

  # ── Optional: trigger Render deploys via webhook ───────────────

  #       service:
  #         - RENDER_AUTH_DEPLOY_HOOK
  #         - RENDER_EMAIL_DEPLOY_HOOK
  #         - RENDER_MARKETING_DEPLOY_HOOK
  #         - RENDER_NOTIFICATION_DEPLOY_HOOK
  #         - RENDER_ANALYTICS_DEPLOY_HOOK
  #         - RENDER_GATEWAY_DEPLOY_HOOK

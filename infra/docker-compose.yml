# docker-compose.yml  — local development stack
# Usage:  docker compose up -d
# Build context is the repo root (..) so Dockerfiles can reach shared/ + services/
version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gmailmanager}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API Gateway (NGINX) ────────────────────────────────────────
  gateway:
    build:
      context: gateway
    environment:
      AUTH_SERVICE_URL: auth:8080
      EMAIL_SERVICE_URL: email:8080
      MARKETING_SERVICE_URL: marketing:8080
      NOTIFICATION_SERVICE_URL: notification:8080
      ANALYTICS_SERVICE_URL: analytics:8080
    ports:
      - "8080:80"
    depends_on:
      - auth
      - email
      - marketing
      - notification
      - analytics

  # ── Microservices ───────────────────────────────────────────────
  auth:
    build:
      context: ..
      dockerfile: backend/services/GmailManager.Auth/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=mysql;Database=gmailmanager;User=root;Password=${MYSQL_ROOT_PASSWORD:-localdev};"
      ConnectionStrings__Redis: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_DEV_SECRET_32CHARS_MIN}
    ports:
      - "5010:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  email:
    build:
      context: ..
      dockerfile: backend/services/GmailManager.Email/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=mysql;Database=gmailmanager;User=root;Password=${MYSQL_ROOT_PASSWORD:-localdev};"
      ConnectionStrings__Redis: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_DEV_SECRET_32CHARS_MIN}
    ports:
      - "5020:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  marketing:
    build:
      context: ..
      dockerfile: backend/services/GmailManager.Marketing/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=mysql;Database=gmailmanager;User=root;Password=${MYSQL_ROOT_PASSWORD:-localdev};"
      ConnectionStrings__Redis: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_DEV_SECRET_32CHARS_MIN}
    ports:
      - "5030:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    build:
      context: ..
      dockerfile: backend/services/GmailManager.Notification/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=mysql;Database=gmailmanager;User=root;Password=${MYSQL_ROOT_PASSWORD:-localdev};"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_DEV_SECRET_32CHARS_MIN}
    ports:
      - "5040:8080"
    depends_on:
      mysql:
        condition: service_healthy

  analytics:
    build:
      context: ..
      dockerfile: backend/services/GmailManager.Analytics/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=mysql;Database=gmailmanager;User=root;Password=${MYSQL_ROOT_PASSWORD:-localdev};"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_DEV_SECRET_32CHARS_MIN}
    ports:
      - "5050:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
